<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kinhu's Adventure</title>
<meta name="description" content="Kinhu's Adventure: um jogo de plataforma em pixel art no estilo Super Nintendo. Ajude o Kinhu a pegar o ônibus, atravessar o centro e sobreviver ao escritório!">
<meta name="theme-color" content="#00153b">
<meta property="og:title" content="Kinhu's Adventure">
<meta property="og:description" content="Plataforma em pixel art estilo SNES. Do ponto de ônibus até a sala dos servidores!">
<meta property="og:image" content="assets/preview.png">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="wrap">
  <canvas id="screen" width="256" height="224" aria-label="Tela do jogo Kinhu's Adventure"></canvas>
  <nav id="bar" aria-label="Opções">
    <span id="mobileHint">MODO TOQUE</span>
    <button id="btnOptions" type="button" title="Abre as configurações; durante a partida, pausa o jogo">Configurações</button>
    <button id="btnFull" type="button" title="Tela cheia (tecla F)">Tela cheia</button>
  </nav>
</main>

<div id="touch" role="group" aria-label="Controles de toque" aria-hidden="true">
  <div class="pad">
    <button type="button" class="up" data-act="up" aria-label="Cima">▲</button>
    <button type="button" class="left" data-act="left" aria-label="Esquerda">◀</button>
    <button type="button" class="right" data-act="right" aria-label="Direita">▶</button>
    <button type="button" class="down" data-act="down" aria-label="Baixo / agachar">▼</button>
  </div>
  <button type="button" class="start" data-act="start" aria-label="Start / pausar">START<small>PAUSA</small></button>
  <div class="ab">
    <button type="button" class="c" data-act="propel" aria-label="Pum propulsor" hidden>C<small>PUM</small></button>
    <button type="button" class="b" data-act="run,back" aria-label="Correr / lançar lata / voltar">B<small>CORRER</small></button>
    <button type="button" class="a" data-act="jump,confirm" aria-label="Pular / confirmar">A<small>PULAR</small></button>
  </div>
</div>

<input type="file" id="loadFile" accept=".json,application/json" hidden>

<script src="js/core.js"></script>
<script src="js/mobile.js"></script>
<script src="js/progression.js"></script>
<script src="js/sprites.js"></script>
<script src="js/world.js"></script>
<script src="js/audio.js"></script>
<script src="js/levels.js"></script>
<script src="js/settings.js"></script>
<script src="js/exploration.js"></script>
<script src="js/save.js"></script>
<script src="js/game.js"></script>
<script src="js/title.js"></script>
<script src="js/introart.js"></script>
<script src="js/cutscenes.js"></script>
<script src="js/origin.js"></script>
<script src="js/kinhurine.js"></script>
<script src="js/main.js"></script>
</body>
</html>
